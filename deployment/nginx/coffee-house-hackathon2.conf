# Include only inside the existing TLS server block for www.xn--k-9gaa.com.
# This exact callback route is separate from Hackathon 1's /soodo/CoffeeHouse/.
location = /soodo/CoffeeHouse-Hackathon2/webhook {
    # Meta sends hub.verify_token in the GET query; keep it out of access logs.
    access_log off;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:18795/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    proxy_cache off;
}
